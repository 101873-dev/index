<body>
<div id="root"></div>
<script>
const { useState, useEffect, useMemo } = React;
const html = htm.bind(React.createElement);

const INIT = [
  {id:1,n:'Aguacate',e:'🥑',d:1,q:'3 pzas',kg:.4,p:38,w:140},
  {id:2,n:'Espinaca',e:'🥬',d:1,q:'1 manojo',kg:.25,p:22,w:30},
  {id:3,n:'Jitomate',e:'🍅',d:2,q:'6 pzas',kg:.8,p:28,w:90},
  {id:4,n:'Plátano',e:'🍌',d:2,q:'5 pzas',kg:.6,p:20,w:110},
  {id:5,n:'Pechuga de pollo',e:'🍗',d:2,q:'700 g',kg:.7,p:96,w:750},
  {id:6,n:'Cilantro',e:'🌿',d:3,q:'1 manojo',kg:.1,p:8,w:10},
  {id:7,n:'Tortillas',e:'🫓',d:4,q:'500 g',kg:.5,p:24,w:40},
  {id:8,n:'Leche',e:'🥛',d:5,q:'1 L',kg:1,p:29,w:250},
  {id:9,n:'Queso panela',e:'🧀',d:6,q:'400 g',kg:.4,p:62,w:500},
  {id:10,n:'Cebolla',e:'🧅',d:9,q:'4 pzas',kg:.5,p:15,w:20},
  {id:11,n:'Limón',e:'🍋',d:8,q:'8 pzas',kg:.3,p:18,w:30},
  {id:12,n:'Huevo',e:'🥚',d:12,q:'12 pzas',kg:.6,p:55,w:200},
];
const LISTA_INIT = [
  {id:100,n:'Manzanas',q:'1 kg'},
  {id:101,n:'Arroz',q:'1 kg'},
  {id:102,n:'Papel higiénico',q:'4 rollos'},
  {id:103,n:'Yogur natural',q:'900 g'},
];
const EMOJI_GUESS = {aguacate:'🥑',espinaca:'🥬',jitomate:'🍅',tomate:'🍅',platano:'🍌',plátano:'🍌',pollo:'🍗',cilantro:'🌿',tortilla:'🫓',leche:'🥛',queso:'🧀',cebolla:'🧅',limon:'🍋',limón:'🍋',huevo:'🥚',fresa:'🍓',yogur:'🥣',calabacita:'🥒',pepino:'🥒',pan:'🍞',arroz:'🍚',frijol:'🫘',papa:'🥔',manzana:'🍎',naranja:'🍊',carne:'🥩',uva:'🍇',zanahoria:'🥕'};
const guessEmoji = n=>{const k=n.toLowerCase(); for(const key in EMOJI_GUESS) if(k.includes(key)) return EMOJI_GUESS[key]; return '🛒';};
const guessDays = n=>{const k=n.toLowerCase();
  if(/verdura|lechuga|espinaca|cilantro|perejil|jitomate|calabacita|brocoli/.test(k)) return 4;
  if(/fruta|fresa|platano|plátano|manzana|naranja|uva|papaya|melon/.test(k)) return 5;
  if(/carne|pollo|pescado|res|jamon|tocino/.test(k)) return 2;
  if(/leche|yogur|queso|crema|lacteo/.test(k)) return 6;
  return 10;};
const RECETAS = [
  {id:'r1',t:'Guacamole con totopos',min:10,ing:['Aguacate','Jitomate','Cebolla','Limón','Cilantro'],paso:'Machaca el aguacate, pica el resto y mezcla con limón. Dora las tortillas para los totopos.'},
  {id:'r2',t:'Tinga de pollo en tostadas',min:35,ing:['Pechuga de pollo','Jitomate','Cebolla','Tortillas'],paso:'Cuece y deshebra el pollo; guísalo con jitomate y cebolla. Sirve sobre tortillas doradas.'},
  {id:'r3',t:'Quesadillas de espinaca',min:15,ing:['Espinaca','Tortillas','Queso panela'],paso:'Saltea la espinaca con cebolla, rellena las tortillas con queso y dora por ambos lados.'},
  {id:'r4',t:'Licuado de plátano',min:5,ing:['Plátano','Leche'],paso:'Licúa el plátano maduro con leche fría y una pizca de canela.'},
  {id:'r5',t:'Huevos a la mexicana',min:12,ing:['Huevo','Jitomate','Cebolla','Cilantro'],paso:'Sofríe cebolla y jitomate, agrega el huevo y revuelve. Termina con cilantro.'},
  {id:'r6',t:'Crema de espinaca y aguacate',min:20,ing:['Espinaca','Aguacate','Cebolla','Leche'],paso:'Cuece espinaca con cebolla, licúa con aguacate y leche, y sirve tibia.'},
];

const BENEF = {
  'Aguacate':'Grasas monoinsaturadas, fibra y potasio; ayuda a sentirte satisfecho por más tiempo.',
  'Espinaca':'Aporta hierro, folato y vitamina K; combina con limón para aprovechar mejor el hierro.',
  'Jitomate':'Fuente de licopeno y vitamina C, antioxidantes que se aprovechan mejor cocidos.',
  'Plátano':'Potasio y carbohidratos de rápida energía; ideal antes o después de ejercitarte.',
  'Pechuga de pollo':'Proteína magra de alta calidad para mantener y reparar músculo.',
  'Cilantro':'Aporta vitamina K y antioxidantes con muy pocas calorías; realza el sabor sin sal.',
  'Tortillas':'El maíz aporta fibra y energía; elige las de maíz nixtamalizado, que también dan calcio.',
  'Leche':'Calcio, proteína y vitamina D para huesos y músculos.',
  'Queso panela':'Proteína y calcio con menos grasa que otros quesos.',
  'Cebolla':'Contiene quercetina y prebióticos que alimentan a tu flora intestinal.',
  'Limón':'Vitamina C; ayuda a absorber el hierro de las verduras de hoja verde.',
  'Huevo':'Proteína completa, colina y vitamina B12; muy versátil y saciante.',
};
const OBJ = [
  {id:'energia',l:'Energía diaria',e:'⚡'},
  {id:'ligero',l:'Ligero y fresco',e:'🥒'},
  {id:'musculo',l:'Más proteína',e:'💪'},
];
const RUTINA = {
  energia:[
    {h:'7:30',t:'Desayuno',d:'Huevos a la mexicana con tortillas y una fruta.'},
    {h:'10:30',t:'Colación',d:'Un plátano con un puño de nueces o cacahuates.'},
    {h:'14:00',t:'Comida',d:'Pollo a la plancha, arroz y ensalada de jitomate con aguacate.'},
    {h:'17:30',t:'Licuado',d:'Verde energético (espinaca, plátano y leche).'},
    {h:'20:30',t:'Cena',d:'Quesadillas de espinaca con queso panela.'},
  ],
  ligero:[
    {h:'7:30',t:'Desayuno',d:'Yogur natural con fruta picada y avena.'},
    {h:'10:30',t:'Colación',d:'Pepino y jícama con limón.'},
    {h:'14:00',t:'Comida',d:'Caldo de verduras con pollo deshebrado y tortillas.'},
    {h:'17:30',t:'Licuado',d:'Cremoso de aguacate, ligero con leche fría.'},
    {h:'20:30',t:'Cena',d:'Ensalada de espinaca, jitomate, huevo cocido y limón.'},
  ],
  musculo:[
    {h:'7:30',t:'Desayuno',d:'3 huevos revueltos con frijoles y tortillas.'},
    {h:'10:30',t:'Colación',d:'Queso panela con jitomate y cilantro.'},
    {h:'14:00',t:'Comida',d:'Pechuga de pollo, arroz y verduras salteadas.'},
    {h:'17:30',t:'Licuado',d:'Proteico de plátano con leche y avena.'},
    {h:'20:30',t:'Cena',d:'Tinga de pollo en tostadas con ensalada.'},
  ],
};
const LICUADOS = [
  {id:'l1',t:'Verde energético',e:'🥬',ing:['Espinaca','Plátano','Leche','Limón'],ben:'Hierro, potasio y vitamina C para arrancar la tarde con energía.',paso:'Licúa todo con hielo hasta que quede terso.'},
  {id:'l2',t:'Cremoso de aguacate',e:'🥑',ing:['Aguacate','Plátano','Leche'],ben:'Grasas saludables y fibra: te mantiene satisfecho y cuida tu corazón.',paso:'Licúa con leche fría; endulza con el plátano maduro.'},
  {id:'l3',t:'Proteico de plátano',e:'🍌',ing:['Plátano','Leche','Avena'],ben:'Carbohidratos y proteína, útiles después de hacer ejercicio.',paso:'Licúa el plátano con leche, avena y una pizca de canela.'},
  {id:'l4',t:'Cítrico con espinaca',e:'🍋',ing:['Espinaca','Limón','Plátano'],ben:'Vitamina C que ayuda a absorber el hierro de la espinaca.',paso:'Licúa con agua fría y hielo; sirve de inmediato.'},
];
const SUGERIDOS = ['Pan','Frijoles','Papa','Zanahoria','Fresa','Naranja','Pepino','Calabacita','Carne molida','Crema','Yogur natural','Arroz'];
const parseQ = q=>{const m=(q||'').match(/^(\d+(?:\.\d+)?)\s*(.*)$/); return m?{n:parseFloat(m[1]),u:m[2]}:null;};
const SCAN_DEMO = {
  ticket:[['Pan de caja','1 pza'],['Yogur natural','900 g'],['Papa','1 kg'],['Pepino','4 pzas'],['Arroz','1 kg']],
  foto:[['Fresa','500 g'],['Naranja','2 kg'],['Calabacita','6 pzas'],['Zanahoria','1 kg'],['Pepino','5 pzas']],
};
const st = d => d<=1?'r':d<=3?'a':'v';
const S = {
  v:{l:'Óptimo',dot:'bg-emerald-500',chip:'bg-emerald-50 text-emerald-800',hex:'#10b981'},
  a:{l:'Consumir pronto',dot:'bg-amber-400',chip:'bg-amber-50 text-amber-800',hex:'#f59e0b'},
  r:{l:'Riesgo inminente',dot:'bg-red-500',chip:'bg-red-50 text-red-700',hex:'#dc2626'},
};
const mxn = n => '$' + n.toLocaleString('es-MX',{maximumFractionDigits:0});
const dias = d => d<=0?'Hoy':d===1?'1 día':d+' días';

const PLANES = [
  {id:'gratis',n:'Básico',p:0,per:'siempre',d:'Para probar SustAIn sin compromiso.'},
  {id:'premium',n:'Premium',p:59,per:'mes',d:'La experiencia completa con tu SustAIn Pod.',destacado:true},
];
const FEATURES = [
  {n:'Alimentos en inventario',v:['Hasta 15','Ilimitado']},
  {n:'Semáforo de estado',v:[true,true]},
  {n:'Lecturas en vivo del SustAIn Pod',v:[false,true]},
  {n:'Recetas con IA',v:['1 por semana','Ilimitadas']},
  {n:'Escaneo de tickets y fotos de tianguis',v:[false,true]},
  {n:'Alertas push de riesgo de descarte',v:[false,true]},
  {n:'Tablero de impacto mensual',v:[true,true]},
  {n:'Cuentas vinculadas del hogar',v:['1','1']},
  {n:'Soporte',v:['Estándar','Prioritario']},
];

const IDIOMAS = [{code:'es',label:'Español',flag:'🇲🇽'},{code:'en',label:'English',flag:'🇺🇸'}];
const GUSTOS = [
  {id:'vegetariano',es:'Vegetariano',en:'Vegetarian',ic:'🥗'},
  {id:'vegano',es:'Vegano',en:'Vegan',ic:'🌱'},
  {id:'sin_gluten',es:'Sin gluten',en:'Gluten-free',ic:'🌾'},
  {id:'picante',es:'Picante',en:'Spicy',ic:'🌶️'},
  {id:'mariscos',es:'Mariscos',en:'Seafood',ic:'🦐'},
  {id:'carnes',es:'Carnes rojas',en:'Red meat',ic:'🥩'},
  {id:'lacteos',es:'Lácteos',en:'Dairy',ic:'🧀'},
  {id:'saludable',es:'Saludable',en:'Healthy',ic:'💪'},
];
const T = {
  es:{tag:'Convierte tu refri en tu aliado contra el desperdicio.',start:'Comenzar',f1:'Monitoreo en vivo con tu SustAIn Pod',f2:'Recetas con IA para lo que esté por vencer',f3:'Ahorro real en pesos, kilos y litros de agua',idiomaT:'¿En qué idioma prefieres usar SustAIn?',idiomaS:'Podrás cambiarlo después.',cont:'Continuar',gustosT:'Cuéntanos tus gustos',gustosS:'Así te sugerimos mejores recetas para tu refri.',fin:'Entrar a SustAIn',omitir:'Omitir por ahora',atras:'Atrás'},
  en:{tag:"Turn your fridge into your best ally against food waste.",start:'Get started',f1:'Live monitoring with your SustAIn Pod',f2:"AI recipes for what's about to expire",f3:'Real savings in money, kilos and water',idiomaT:'Which language do you prefer for SustAIn?',idiomaS:'You can change it later.',cont:'Continue',gustosT:'Tell us your food preferences',gustosS:"We'll suggest better recipes for your fridge.",fin:'Enter SustAIn',omitir:'Skip for now',atras:'Back'},
};

function App(){
  const [tab,setTab]=useState('nevera');
  const [inv,setInv]=useState(INIT);
  const [imp,setImp]=useState({mxn:486,kg:9.8,agua:3150,hist:[]});
  const [busy,setBusy]=useState(null);
  const [toast,setToast]=useState(null);
  const [tick,setTick]=useState(0);
  const [thinking,setThinking]=useState(false);
  const [plan,setPlan]=useState('gratis');
  const [lista,setLista]=useState(LISTA_INIT);
  const [nuevoN,setNuevoN]=useState('');
  const [nuevoQ,setNuevoQ]=useState('');
  const [compartiendo,setCompartiendo]=useState(false);
  const [obj,setObj]=useState('energia');
  const [scanMode,setScanMode]=useState('ticket');
  const [scanImg,setScanImg]=useState(null);
  const [scanSt,setScanSt]=useState('idle');
  const [scanItems,setScanItems]=useState([]);
  const [flow,setFlow]=useState('landing');
  const [idioma,setIdioma]=useState('es');
  const [gustos,setGustos]=useState([]);
  const t = T[idioma];
  const toggleGusto = id=>setGustos(cur=>cur.includes(id)?cur.filter(x=>x!==id):[...cur,id]);

  useEffect(()=>{const i=setInterval(()=>setTick(t=>t+1),2500);return()=>clearInterval(i)},[]);
  useEffect(()=>{if(toast){const t=setTimeout(()=>setToast(null),3200);return()=>clearTimeout(t)}},[toast]);
  useEffect(()=>{if(tab==='recetas'){setThinking(true);const t=setTimeout(()=>setThinking(false),1100);return()=>clearTimeout(t)}},[tab]);

  const groups = useMemo(()=>({r:inv.filter(i=>st(i.d)==='r'),a:inv.filter(i=>st(i.d)==='a'),v:inv.filter(i=>st(i.d)==='v')}),[inv]);
  const worst = groups.r.length?'r':groups.a.length?'a':'v';
  const urgent = [...groups.r,...groups.a];
  const urgentNames = urgent.map(i=>i.n);
  const temp = +(3.6 + Math.sin(tick*1.3)*0.3).toFixed(1);

  const recetas = useMemo(()=>{
    const names = inv.map(i=>i.n);
    return RECETAS.filter(r=>r.ing.every(x=>names.includes(x)))
      .map(r=>({...r,use:r.ing.filter(x=>urgentNames.includes(x))}))
      .filter(r=>r.use.length>0)
      .sort((a,b)=>b.use.length-a.use.length).slice(0,3);
  },[inv]);

  const agregarALista = ()=>{
    if(!nuevoN.trim()) return;
    setLista(cur=>[...cur,{id:Date.now(),n:nuevoN.trim(),q:nuevoQ.trim()||'1 pza'}]);
    setNuevoN(''); setNuevoQ('');
  };
  const agregarRapido = n=>{
    setLista(cur=>[...cur,{id:Date.now()+Math.random(),n,q:'1 pza'}]);
    setToast(`${n} agregado a tu lista`);
  };
  const marcar = item=>setLista(cur=>cur.map(i=>i.id===item.id?{...i,ok:!i.ok}:i));
  const cambiarCant = (item,delta)=>setLista(cur=>cur.map(i=>{
    if(i.id!==item.id) return i;
    const p=parseQ(i.q); if(!p) return i;
    const n=Math.max(1,+(p.n+delta).toFixed(2));
    return {...i,q:(p.u?n+' '+p.u:String(n))};
  }));
  const limpiarMarcados = ()=>setLista(cur=>cur.filter(i=>!i.ok));
  const comprarMarcados = ()=>{
    const ms = lista.filter(i=>i.ok); if(!ms.length) return;
    setInv(cur=>[...cur,...ms.map((i,k)=>({id:Date.now()+k,n:i.n,e:guessEmoji(i.n),d:guessDays(i.n),q:i.q,kg:.3,p:25,w:60}))]);
    setLista(cur=>cur.filter(i=>!i.ok));
    setToast(`${ms.length} ${ms.length===1?'producto pasó':'productos pasaron'} a tu refri`);
  };
  const quitarDeLista = item=>{
    setLista(cur=>cur.filter(i=>i.id!==item.id));
  };
  const yaLoCompre = item=>{
    setLista(cur=>cur.filter(i=>i.id!==item.id));
    const d = guessDays(item.n);
    setInv(cur=>[...cur,{id:Date.now(),n:item.n,e:guessEmoji(item.n),d,q:item.q,kg:.3,p:25,w:60}]);
    setToast(`${item.n} agregado a tu refri · caducidad estimada: ${dias(d)}`);
  };
  const compartirTexto = ()=>'🛒 Lista de compras SustAIn\n'+lista.map(i=>`• ${i.n} — ${i.q}`).join('\n');
  const copiarLista = ()=>{
    try{ navigator.clipboard.writeText(compartirTexto()); setToast('Lista copiada, ¡pégala en WhatsApp o donde quieras!'); }
    catch(e){ setToast('No se pudo copiar automáticamente, selecciona el texto para copiarlo.'); }
  };

  const rescue = (items)=>{
    const s = items.filter(i=>urgentNames.includes(i.n));
    return {m:s.reduce((a,i)=>a+i.p,0),k:s.reduce((a,i)=>a+i.kg,0),w:s.reduce((a,i)=>a+i.w,0)};
  };
  const cook = r=>{
    const used = inv.filter(i=>r.ing.includes(i.n));
    const {m,k,w} = rescue(used);
    setInv(cur=>cur.filter(i=>!r.ing.includes(i.n)));
    setImp(c=>({mxn:c.mxn+m,kg:+(c.kg+k).toFixed(2),agua:c.agua+w,hist:[{t:r.t,m},...c.hist]}));
    setToast(`¡Buen provecho! Descontamos ${used.length} ingredientes · +${mxn(m)} rescatados`);
  };
  const consumed = i=>{
    const {m,k,w} = rescue([i]);
    setInv(cur=>cur.filter(x=>x.id!==i.id));
    if(m) setImp(c=>({...c,mxn:c.mxn+m,kg:+(c.kg+k).toFixed(2),agua:c.agua+w}));
    setToast(m?`${i.n} consumido a tiempo · +${mxn(m)}`:`${i.n} retirado del inventario`);
  };

  const Sensor = ({label,val,unit,pct,tone,note}) => html`
    <div className="bg-white rounded-2xl p-4 border border-slate-200">
      <div className="flex justify-between text-xs text-slate-500"><span>${label}</span><span className=${tone==='r'?'text-red-600 font-semibold':tone==='a'?'text-amber-600 font-semibold':'text-emerald-700 font-semibold'}>${note}</span></div>
      <div className="text-3xl font-extrabold mt-1">${val} <span className="text-sm font-medium text-slate-400">${unit}</span></div>
      <div className="h-1.5 rounded bg-slate-100 mt-3"><div className=${'h-1.5 rounded '+S[tone==='r'?'r':tone==='a'?'a':'v'].dot} style=${{width:Math.min(100,pct)+'%',transition:'width .8s'}}></div></div>
    </div>`;

  const Col = ({k,label}) => html`
    <div className="bg-white rounded-2xl border border-slate-200 p-4">
      <div className="flex items-center gap-2 mb-2">
        <span className=${'w-2.5 h-2.5 rounded-full '+S[k].dot}></span>
        <h3 className="font-bold">${label}</h3>
        <span className="ml-auto text-xs text-slate-400">${groups[k].length}</span>
      </div>
      ${groups[k].length===0?html`<p className="text-sm text-slate-400 py-6 text-center">Sin productos en este estado.</p>`
      :html`<div className="divide-y divide-slate-100">${groups[k].map(i=>html`
        <div key=${i.id} className="flex items-center gap-3 py-2.5">
          <div className="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center text-xl">${i.e}</div>
          <div className="flex-1 min-w-0">
            <div className="font-semibold text-[15px] truncate">${i.n}</div>
            <div className="text-xs text-slate-500">${i.q} · ${dias(i.d)}</div>
          </div>
          <button onClick=${()=>consumed(i)} title="Marcar como consumido" className="text-xs font-semibold px-3 py-1.5 rounded-full border border-slate-200 hover:bg-emerald-50 hover:border-emerald-300 hover:text-emerald-800 transition">Consumido</button>
        </div>`)}</div>`}
    </div>`;

  const Nevera = () => html`<div className="space-y-4">
    <div className="rounded-3xl bg-slate-900 text-white p-6 flex items-center justify-between gap-6">
      <div>
        <div className="text-slate-400 text-sm mb-1">Estado del refrigerador</div>
        <div className="text-3xl sm:text-4xl font-extrabold leading-tight">${worst==='v'?'Todo en orden':worst==='a'?'Cocina esto pronto':'Riesgo inminente de descarte'}</div>
        <div className="text-slate-300 mt-2">${groups.r.length} en rojo · ${groups.a.length} en amarillo · ${groups.v.length} óptimos</div>
      </div>

    </div>
    <p className="text-xs text-slate-400 mt-5">Demo: la suscripción es simulada, no se realiza ningún cobro.</p>
  </div>`;

  const tabs=[['nevera','Mi refri','❄️','Estado del refrigerador','Refri'],['lista','Lista de compras','🛒','Lista de compras','Lista'],['escaneo','Escaneo','📷','Escaneo','Scan'],['recetas','Cocina esto primero','🍳','Cocina esto primero','Recetas'],['impacto','Mi impacto','🌱','Tu impacto este mes','Impacto'],['nutricion','Nutrición','🥗','Modo nutrición','Nutri'],['suscripcion','Suscripción','💳','Suscripción','Plan']];
  const cur = tabs.find(t=>t[0]===tab);

      </div>
      <nav className="space-y-1">
        ${tabs.map(([k,l,e])=>html`<button key=${k} onClick=${()=>setTab(k)} aria-current=${tab===k} className=${'w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left font-semibold transition '+(tab===k?'bg-emerald-600 text-white':'text-slate-300 hover:bg-slate-800')}><span>${e}</span>${l}</button>`)}
      </nav>
      <div className="mt-auto rounded-2xl bg-slate-800 p-4 text-sm">

      </div>
    </aside>

            <div className="w-8 h-8 rounded-lg bg-emerald-700 text-white flex items-center justify-center font-extrabold">S</div>
            <span className="text-lg font-extrabold">Sust<span className="text-emerald-700">AI</span>n</span>
          </div>
          <h1 className="hidden lg:block text-3xl font-extrabold tracking-tight">${cur[3]}</h1>
          <span className="text-sm text-slate-500">Hola, familia Ramírez</span>

        <h1 className="lg:hidden text-2xl font-extrabold tracking-tight mb-4">${cur[3]}</h1>
        ${tab==='nevera'&&html`<${Nevera}/>`}

        ${tab==='escaneo'&&html`<${Escaneo}/>`}

        ${tab==='suscripcion'&&html`<${Suscripcion}/>`}
      </div>

    <nav className="lg:hidden fixed bottom-0 inset-x-0 grid grid-cols-7 bg-white border-t border-slate-200" style=${{paddingBottom:'env(safe-area-inset-bottom,0px)'}}>
      ${tabs.map(([k,l,e,_,short])=>html`<button key=${k} onClick=${()=>setTab(k)} aria-current=${tab===k} className=${'py-3 flex flex-col items-center gap-0.5 text-[11px] font-semibold '+(tab===k?'text-emerald-700':'text-slate-400')}><span className=${'text-lg '+(tab===k?'':'grayscale opacity-60')}>${e}</span>${short}</button>`)}
    </nav>
    ${compartiendo&&html`<div className="fixed inset-0 z-50 bg-slate-900/70 flex items-center justify-center p-4" onClick=${()=>setCompartiendo(false)}>
